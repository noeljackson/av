syntax = "proto3";

package av.v1;

service SessionService {
  rpc GetAuthConfig(GetAuthConfigRequest) returns (AuthConfig);
  rpc GetStatus(GetStatusRequest) returns (Status);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc ListProxyDestinations(ListProxyDestinationsRequest) returns (ListProxyDestinationsResponse);
  rpc GetProfileEnvironment(GetProfileEnvironmentRequest) returns (ProfileEnvironment);
  rpc CreateProxySession(CreateProxySessionRequest) returns (ProxySessionLease);
  rpc RenewProxySession(RenewProxySessionRequest) returns (ProxySessionLease);
  rpc RevokeProxySession(RevokeProxySessionRequest) returns (ProxySessionLease);
}

service ControlService {
  rpc ListBasicUsers(ListBasicUsersRequest) returns (ListBasicUsersResponse);
  rpc UpsertBasicUser(UpsertBasicUserRequest) returns (BasicUser);
  rpc SetBasicUserEnabled(SetBasicUserEnabledRequest) returns (BasicUser);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc CreateAgent(CreateAgentRequest) returns (AgentCredential);
  rpc RotateAgent(RotateAgentRequest) returns (AgentCredential);
  rpc SetAgentEnabled(SetAgentEnabledRequest) returns (Agent);
  rpc DeleteAgent(DeleteAgentRequest) returns (Agent);
  rpc ListPrincipalRoles(ListPrincipalRolesRequest) returns (ListPrincipalRolesResponse);
  rpc SetPrincipalRole(SetPrincipalRoleRequest) returns (PrincipalRole);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc ListProfileGrants(ListProfileGrantsRequest) returns (ListProfileGrantsResponse);
  rpc GrantProfile(GrantProfileRequest) returns (ProfileGrant);
  rpc RevokeProfile(RevokeProfileRequest) returns (ProfileGrant);
}

message GetAuthConfigRequest {}

message AuthConfig {
  string mode = 1;
  string issuer = 2;
  string client_id = 3;
  repeated string scopes = 4;
  string authorization_endpoint = 5;
  string token_endpoint = 6;
  string device_authorization_endpoint = 7;
}

message GetStatusRequest {}

message Connector {
  string name = 1;
  string kind = 2;
}

message Status {
  bool oidc_enabled = 1;
  bool basic_enabled = 2;
  bool persistence_enabled = 3;
  bool registration_enabled = 4;
  repeated Connector connectors = 5;
  uint32 profile_count = 6;
  repeated string proxy_routes = 7;
  uint32 api_rate_limit_per_second = 8;
  uint32 api_rate_limit_burst = 9;
}

message ListProfilesRequest {}

message Profile {
  string name = 1;
  string environment = 2;
  string secret_path = 3;
}

message ListProfilesResponse {
  repeated Profile profiles = 1;
}

message ListProxyDestinationsRequest {}

message ProxyDestination {
  string name = 1;
  string profile = 2;
  string host = 3;
  // injecting or tunnel
  string mode = 4;
}

message ListProxyDestinationsResponse {
  repeated ProxyDestination destinations = 1;
}

message GetProfileEnvironmentRequest {
  string profile = 1;
  string executable_basename = 2;
}

message EnvironmentValue {
  string name = 1;
  string value = 2;
}

message ProfileEnvironment {
  repeated EnvironmentValue values = 1;
}

message CreateProxySessionRequest {
  string profile = 1;
}

message RenewProxySessionRequest {
  string session_id = 1;
}

message RevokeProxySessionRequest {
  string session_id = 1;
}

// The token is returned once over the authenticated control-plane TLS
// connection. AV persists only its SHA-256 digest. The local helper, never its
// child process, keeps the raw token in memory.
message ProxySessionLease {
  string session_id = 1;
  string token = 2;
  string proxy_url = 3;
  string ca_certificate_pem = 4;
  int64 expires_unix_seconds = 5;
  bool revoked = 6;
}

message ListBasicUsersRequest {}

message BasicUser {
  string username = 1;
  bool enabled = 2;
}

message ListBasicUsersResponse {
  repeated BasicUser users = 1;
}

message UpsertBasicUserRequest {
  string username = 1;
  string password = 2;
}

message SetBasicUserEnabledRequest {
  string username = 1;
  bool enabled = 2;
}

message ListAgentsRequest {}

message Agent {
  string name = 1;
  bool enabled = 2;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message CreateAgentRequest {
  string name = 1;
}

message RotateAgentRequest {
  string name = 1;
}

message SetAgentEnabledRequest {
  string name = 1;
  bool enabled = 2;
}

message DeleteAgentRequest {
  string name = 1;
}

// The raw token is returned only from create and rotate. AV stores only its
// SHA-256 digest and cannot recover it later.
message AgentCredential {
  string name = 1;
  string token = 2;
  bool enabled = 3;
}

message ListPrincipalRolesRequest {}

message PrincipalRole {
  string subject = 1;
  string role = 2;
}

message ListPrincipalRolesResponse {
  repeated PrincipalRole roles = 1;
}

message SetPrincipalRoleRequest {
  string subject = 1;
  string role = 2;
}

message ListAuditEventsRequest {
  uint32 limit = 1;
}

message AuditEvent {
  int64 created_unix_seconds = 1;
  string actor = 2;
  string action = 3;
  string profile = 4;
  string route = 5;
  string executable_basename = 6;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
}

message ListProfileGrantsRequest {
  string profile = 1;
}

message ProfileGrant {
  string profile = 1;
  string subject = 2;
  // both, proxy, or environment
  string mode = 3;
  // Zero means no expiry.
  int64 expires_unix_seconds = 4;
}

message ListProfileGrantsResponse {
  repeated ProfileGrant grants = 1;
}

message GrantProfileRequest {
  string profile = 1;
  string subject = 2;
  // Empty preserves the backwards-compatible both-mode behavior.
  string mode = 3;
  // Zero means no expiry.
  int64 expires_unix_seconds = 4;
}

message RevokeProfileRequest {
  string profile = 1;
  string subject = 2;
}

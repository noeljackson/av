replicaCount: 1

image:
  repository: ghcr.io/noeljackson/av
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 14322

# The transparent listener is deliberately opt-in. It is a private CONNECT/TLS
# interception service, never an Ingress backend. proxyUrl is the private
# HTTPS origin local `av run` helpers reach; it must resolve only inside the
# chosen trusted network boundary.
transparentProxy:
  enabled: false
  port: 14323
  proxyUrl: ""
  sessionTtlSeconds: 300
  sessionMaxLifetimeSeconds: 28800
  transportTlsSecret:
    name: ""
    certificateKey: tls.crt
    privateKeyKey: tls.key
  caSecret:
    name: ""
    certificateKey: ca.crt
    privateKeyKey: ca.key
  networkPolicy:
    enabled: false
    # Select only workloads that must use `av run`. An empty selector is never
    # accepted because it would default-deny every workload in the namespace.
    workloadSelector: {}
    # Selectors are evaluated in this release namespace unless a namespace
    # selector is supplied. Configure the control-plane source explicitly when
    # an Ingress/controller needs access to AV's normal HTTP port.
    proxyClientNamespaceSelector: {}
    proxyClientPodSelector: {}
    controlPlaneIngress: []
    # Kubernetes DNS defaults shown here work on common clusters; override for
    # a different resolver label/namespace.
    dnsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    dnsPodSelector:
      matchLabels:
        k8s-app: kube-dns
  cilium:
    enabled: false
    # Cilium enforcement mirrors the workload NetworkPolicy so direct TCP and
    # UDP/443 have no allowed path. It is kept separate because Cilium CRDs are
    # not installed on every Kubernetes distribution.
    workloadSelector: {}
    dnsEndpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: av.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

credentialSecrets: []
# - name: av-basic
#   secretName: av-basic
#   mountPath: /var/run/av/basic

# Static mode is the portable, Git-managed configuration. Managed mode keeps
# the same immutable connector bootstrap here, while owner-managed policy and
# audit records live in an existing PostgreSQL database. AV never installs or
# creates that database or its Secret.
controlPlane:
  mode: static # static | managed
  # Existing Secret is intended for local/simple deployments. Production
  # Kubernetes can instead enable openbaoAgent so no durable database
  # credential is copied into a Kubernetes Secret.
  existingDatabaseSecret:
    name: ""
    key: database-url
  openbaoAgent:
    enabled: false
    address: ""
    authPath: auth/kubernetes
    role: ""
    secretPath: ""
    tlsSecretName: ""
    caCertificatePath: /vault/tls/ca.crt
    tlsServerName: ""
    credentialsFile: /vault/secrets/database-credentials.json
    reloadIntervalSeconds: 5
    postgres:
      host: ""
      port: 5432
      database: ""
      sslMode: require
      role: ""
  # Exact OIDC `sub` for the first owner of an empty database. This is an
  # identifier, not a credential. It is ignored in static mode.
  initialOwnerOidcSubject: ""

config:
  listen: "0.0.0.0:14322"
  public_url: "https://av.example.com"
  auth:
    mode: oidc
    issuer: "https://zitadel.example.com"
    client_id: "replace-me"
    audiences: ["replace-me"]
    scopes: ["openid", "groups"]
    signing_algorithms: ["RS256"]
    allowed_groups: ["av-users"]
    group_claim: groups
    basic_users: []
  connectors: {}
  profiles: {}
  proxy_routes: {}
  proxy_tunnels: {}
  max_connector_concurrency: 16
  api_rate_limit_per_second: 50
  api_rate_limit_burst: 100

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 500m
    memory: 192Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

nodeSelector: {}
tolerations: []
affinity: {}

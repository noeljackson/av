{{- $config := deepCopy .Values.config -}}
{{- if eq .Values.controlPlane.mode "managed" -}}
{{- $ownerSubject := required "controlPlane.initialOwnerOidcSubject is required in managed mode" .Values.controlPlane.initialOwnerOidcSubject -}}
{{- $_ := set $config "mode" "managed" -}}
{{- if .Values.controlPlane.openbaoAgent.enabled -}}
{{- $agent := .Values.controlPlane.openbaoAgent -}}
{{- $postgres := $agent.postgres -}}
{{- $managed := dict
    "database_credentials_file" $agent.credentialsFile
    "database_reload_interval_seconds" $agent.reloadIntervalSeconds
    "postgres" (dict
      "host" (required "controlPlane.openbaoAgent.postgres.host is required" $postgres.host)
      "port" $postgres.port
      "database" (required "controlPlane.openbaoAgent.postgres.database is required" $postgres.database)
      "ssl_mode" $postgres.sslMode
      "role" (required "controlPlane.openbaoAgent.postgres.role is required" $postgres.role))
    "initial_owner_oidc_subject" $ownerSubject -}}
{{- $_ := set $config "managed" $managed -}}
{{- else -}}
{{- $databaseSecretName := required "controlPlane.existingDatabaseSecret.name is required in managed mode when openbaoAgent is disabled" .Values.controlPlane.existingDatabaseSecret.name -}}
{{- $_ := $databaseSecretName -}}
{{- $_ := set $config "managed" (dict "database_url_file" "/var/run/av/control-plane/database-url" "initial_owner_oidc_subject" $ownerSubject) -}}
{{- end -}}
{{- else if eq .Values.controlPlane.mode "static" -}}
{{- $_ := set $config "mode" "static" -}}
{{- $_ := unset $config "managed" -}}
{{- else -}}
{{- fail "controlPlane.mode must be static or managed" -}}
{{- end -}}
{{- if .Values.transparentProxy.enabled -}}
{{- if ne .Values.controlPlane.mode "managed" -}}
{{- fail "transparentProxy.enabled requires controlPlane.mode=managed for revocable sessions" -}}
{{- end -}}
{{- $proxyURL := required "transparentProxy.proxyUrl is required when transparentProxy.enabled" .Values.transparentProxy.proxyUrl -}}
{{- $transportTlsSecretName := required "transparentProxy.transportTlsSecret.name is required when transparentProxy.enabled" .Values.transparentProxy.transportTlsSecret.name -}}
{{- $caSecretName := required "transparentProxy.caSecret.name is required when transparentProxy.enabled" .Values.transparentProxy.caSecret.name -}}
{{- $_ := $transportTlsSecretName -}}
{{- $_ := $caSecretName -}}
{{- $_ := set $config "transparent_proxy" (dict "listen" (printf "0.0.0.0:%v" .Values.transparentProxy.port) "proxy_url" $proxyURL "transport_tls_certificate_file" "/var/run/av/transparent-proxy-transport/tls.crt" "transport_tls_private_key_file" "/var/run/av/transparent-proxy-transport/tls.key" "ca_certificate_file" "/var/run/av/transparent-proxy-ca/ca.crt" "ca_private_key_file" "/var/run/av/transparent-proxy-ca/ca.key") -}}
{{- else -}}
{{- $_ := unset $config "transparent_proxy" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "av.fullname" . }}
  labels:
    {{- include "av.labels" . | nindent 4 }}
data:
  config.json: {{ $config | toJson | quote }}

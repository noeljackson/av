apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "av.fullname" . }}
  labels:
    {{- include "av.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "av.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "av.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ printf "%s:%s:%s:%s" (.Values.config | toJson) .Values.controlPlane.mode .Values.controlPlane.initialOwnerOidcSubject (.Values.transparentProxy | toJson) | sha256sum }}
        {{- if and (eq .Values.controlPlane.mode "managed") .Values.controlPlane.openbaoAgent.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: {{ .Values.controlPlane.openbaoAgent.authPath | quote }}
        vault.hashicorp.com/role: {{ required "controlPlane.openbaoAgent.role is required" .Values.controlPlane.openbaoAgent.role | quote }}
        vault.hashicorp.com/service: {{ required "controlPlane.openbaoAgent.address is required" .Values.controlPlane.openbaoAgent.address | quote }}
        vault.hashicorp.com/tls-secret: {{ required "controlPlane.openbaoAgent.tlsSecretName is required" .Values.controlPlane.openbaoAgent.tlsSecretName | quote }}
        vault.hashicorp.com/ca-cert: {{ .Values.controlPlane.openbaoAgent.caCertificatePath | quote }}
        vault.hashicorp.com/tls-server-name: {{ required "controlPlane.openbaoAgent.tlsServerName is required" .Values.controlPlane.openbaoAgent.tlsServerName | quote }}
        vault.hashicorp.com/agent-inject-secret-database-credentials.json: {{ required "controlPlane.openbaoAgent.secretPath is required" .Values.controlPlane.openbaoAgent.secretPath | quote }}
        vault.hashicorp.com/agent-inject-file-database-credentials.json: "database-credentials.json"
        vault.hashicorp.com/agent-inject-template-database-credentials.json: |
          {{`{{- with secret "`}}{{ required "controlPlane.openbaoAgent.secretPath is required" .Values.controlPlane.openbaoAgent.secretPath }}{{`" -}}`}}
          {{`{{ .Data | toJSON }}`}}
          {{`{{- end }}`}}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "av.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: av
          image: {{ include "av.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/av/config.json"]
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.transparentProxy.enabled }}
            - name: proxy
              containerPort: {{ .Values.transparentProxy.port }}
              protocol: TCP
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/av
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if and (eq .Values.controlPlane.mode "managed") (not .Values.controlPlane.openbaoAgent.enabled) }}
            - name: control-plane-database
              mountPath: /var/run/av/control-plane
              readOnly: true
            {{- end }}
            {{- range .Values.credentialSecrets }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.transparentProxy.enabled }}
            - name: transparent-proxy-transport
              mountPath: /var/run/av/transparent-proxy-transport
              readOnly: true
            - name: transparent-proxy-ca
              mountPath: /var/run/av/transparent-proxy-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "av.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if and (eq .Values.controlPlane.mode "managed") (not .Values.controlPlane.openbaoAgent.enabled) }}
        - name: control-plane-database
          secret:
            secretName: {{ required "controlPlane.existingDatabaseSecret.name is required in managed mode" .Values.controlPlane.existingDatabaseSecret.name }}
            items:
              - key: {{ required "controlPlane.existingDatabaseSecret.key is required in managed mode" .Values.controlPlane.existingDatabaseSecret.key }}
                path: database-url
        {{- end }}
        {{- range .Values.credentialSecrets }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
        {{- if .Values.transparentProxy.enabled }}
        - name: transparent-proxy-transport
          secret:
            secretName: {{ required "transparentProxy.transportTlsSecret.name is required when transparentProxy.enabled" .Values.transparentProxy.transportTlsSecret.name }}
            items:
              - key: {{ .Values.transparentProxy.transportTlsSecret.certificateKey }}
                path: tls.crt
              - key: {{ .Values.transparentProxy.transportTlsSecret.privateKeyKey }}
                path: tls.key
        - name: transparent-proxy-ca
          secret:
            secretName: {{ required "transparentProxy.caSecret.name is required when transparentProxy.enabled" .Values.transparentProxy.caSecret.name }}
            items:
              - key: {{ .Values.transparentProxy.caSecret.certificateKey }}
                path: ca.crt
              - key: {{ .Values.transparentProxy.caSecret.privateKeyKey }}
                path: ca.key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

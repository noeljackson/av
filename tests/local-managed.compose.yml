services:
  setup:
    environment:
      # Set all three values only for the direct GitHub OAuth browser test.
      # The host secret file is mounted only into setup; setup copies it into
      # the disposable named volume for AV to read at startup.
      AV_TEST_GITHUB_CLIENT_ID: ${AV_TEST_GITHUB_CLIENT_ID:-}
      AV_TEST_GITHUB_OWNER_ID: ${AV_TEST_GITHUB_OWNER_ID:-}
      AV_TEST_GITHUB_CLIENT_SECRET_FILE: /run/local-secrets/github-client-secret
    volumes:
      - ${AV_TEST_GITHUB_CLIENT_SECRET_FILE:-/dev/null}:/run/local-secrets/github-client-secret:ro

  av:
    ports:
      - 127.0.0.1:14322:14322
      - 127.0.0.1:14323:14323
    networks:
      - connectors
      - github-egress

networks:
  github-egress: {}

services:
  av:
    ports:
      - 127.0.0.1:14322:14322
      - 127.0.0.1:14323:14323
    # Docker does not install host port forwarding for a container attached
    # only to an internal network. This test-only bridge makes the two
    # loopback publishes reachable; the enforced child still uses `network
    # none` and has no attachment to either Compose network.
    networks:
      - connectors
      - host-publish

networks:
  host-publish: {}

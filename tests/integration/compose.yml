name: av-connectors

services:
  postgres-tls-init:
    image: docker.io/library/postgres:14-alpine@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /input/server.crt /tls/server.crt
        cp /input/server.key /tls/server.key
        chown 70:70 /tls/server.crt /tls/server.key
        chmod 0444 /tls/server.crt
        chmod 0600 /tls/server.key
    read_only: true
    volumes:
      # /dev/null makes an omitted fixture fail closed inside the init
      # container while still allowing `docker compose down` without retaining
      # the temporary host directory path.
      - ${AV_POSTGRES_TLS_DIR:-/dev/null}:/input:ro
      - postgres-tls:/tls
    networks: [connectors]

  agent-credentials-init:
    image: docker.io/library/postgres:14-alpine@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 65532:65532 /credentials && chmod 0700 /credentials"]
    read_only: true
    volumes:
      - agent-credentials:/credentials
    networks: [connectors]

  postgres:
    image: docker.io/library/postgres:14-alpine@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
    depends_on:
      postgres-tls-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: infisical
      POSTGRES_PASSWORD: integration-only
      POSTGRES_USER: infisical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=infisical --dbname=infisical"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [connectors]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/tls:ro

  av-database-bootstrap:
    image: docker.io/library/postgres:14-alpine@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: integration-only
      PGSSLMODE: require
    command:
      - /bin/sh
      - -ec
      - |
        psql -h postgres -U infisical -d postgres -tAc \
          "SELECT 1 FROM pg_roles WHERE rolname = 'av_owner'" | grep -qx 1 ||
          psql -h postgres -U infisical -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE av_owner NOLOGIN"
        psql -h postgres -U infisical -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = 'av'" | grep -qx 1 ||
          psql -h postgres -U infisical -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE av OWNER av_owner"
    read_only: true
    networks: [connectors]

  redis:
    image: docker.io/library/redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [connectors]

  infisical:
    image: docker.io/infisical/infisical:v0.160.7@sha256:48d9449db915dc0fec703bceab9c36a7fc48cc8839f52b9efa26258e8c6cc917
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_SECRET: integration-only-auth-secret-integration-only-auth-secret
      DB_CONNECTION_URI: postgres://infisical:integration-only@postgres:5432/infisical
      ENCRYPTION_KEY: 9e1884bb3f26d05f76c116a0d6e3b52f # gitleaks:allow -- synthetic disposable integration key
      NODE_ENV: production
      OTEL_TELEMETRY_COLLECTION_ENABLED: "false"
      REDIS_URL: redis://redis:6379
      SITE_URL: http://infisical:8080
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    networks: [connectors]

  openbao:
    image: docker.io/openbao/openbao:2.5.4@sha256:436eaf9778cad75507ff70ea26ace30dcbe15606e619ac3823495663d7f7c115
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: integration-only-root
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [connectors]

  upstream:
    image: docker.io/library/python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
    command: ["python", "/test/upstream.py"]
    read_only: true
    volumes:
      - ./upstream.py:/test/upstream.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz',timeout=2)
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      connectors:
        aliases:
          - upstream-auth
          - upstream-stream
          - upstream-x-api
          - upstream-ungranted

  setup:
    image: docker.io/library/python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
    command: ["python", "/test/setup.py"]
    read_only: true
    depends_on:
      infisical:
        condition: service_healthy
      openbao:
        condition: service_healthy
      av-database-bootstrap:
        condition: service_completed_successfully
    environment:
      INFISICAL_URL: http://infisical:8080
      OPENBAO_ROOT_TOKEN: integration-only-root
      OPENBAO_URL: http://openbao:8200
    volumes:
      - connector-state:/state
      - ./setup.py:/test/setup.py:ro
    networks: [connectors]

  openbao-agent:
    image: docker.io/openbao/openbao:2.5.4@sha256:436eaf9778cad75507ff70ea26ace30dcbe15606e619ac3823495663d7f7c115
    command: ["agent", "-config=/state/openbao-agent.hcl"]
    depends_on:
      setup:
        condition: service_completed_successfully
      agent-credentials-init:
        condition: service_completed_successfully
    user: "65532:65532"
    healthcheck:
      test: ["CMD-SHELL", "test -s /credentials/database-credentials.json"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - connector-state:/state:ro
      - agent-credentials:/credentials
    networks: [connectors]

  av:
    image: ${AV_IMAGE:-av:integration}
    build:
      context: ../..
    command: ["serve", "--config", "/state/config.json"]
    read_only: true
    depends_on:
      openbao-agent:
        condition: service_healthy
      upstream:
        condition: service_healthy
    environment:
      AV_ALLOW_INSECURE_CONNECTORS: integration-tests-only
    volumes:
      - connector-state:/state:ro
      - agent-credentials:/credentials:ro
      - ${AV_POSTGRES_TLS_DIR:-/dev/null}:/test-tls:ro
    networks: [connectors]

  managed-seed:
    image: docker.io/library/postgres:14-alpine@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    command:
      - sh
      - -ec
      - |
        database_url="$$(cat /state/av-control-plane-url)"
        password_hash="$$(cat /state/av-password.argon2id)"
        until psql "$$database_url" -tAc "SELECT to_regclass('av_basic_users')" | grep -qx av_basic_users; do sleep 1; done
        psql "$$database_url" -v ON_ERROR_STOP=1 -v password_hash="$$password_hash" <<'SQL'
        INSERT INTO av_basic_users (username, password_hash, enabled)
        VALUES ('operator', :'password_hash', TRUE)
        ON CONFLICT (username) DO UPDATE SET password_hash = EXCLUDED.password_hash, enabled = TRUE;
        INSERT INTO av_capability_grants (subject, profile, mode, expires_unix_seconds)
        VALUES
          ('basic:operator', 'infisical-integration', 'both', NULL),
          ('basic:operator', 'openbao-integration', 'both', NULL)
        ON CONFLICT (subject, profile) DO UPDATE SET mode = EXCLUDED.mode, expires_unix_seconds = NULL;
        -- Test-only owner fixture: production bootstraps an OIDC subject.
        INSERT INTO av_owners (subject)
        VALUES ('basic:operator')
        ON CONFLICT (subject) DO NOTHING;
        INSERT INTO av_principal_roles (subject, role)
        VALUES ('basic:operator', 'owner')
        ON CONFLICT (subject) DO UPDATE SET role = EXCLUDED.role;
        SQL
    read_only: true
    volumes:
      - connector-state:/state:ro
    networks: [connectors]

  verify:
    image: docker.io/library/python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
    command: ["python", "/test/verify.py"]
    read_only: true
    depends_on:
      av:
        condition: service_started
      managed-seed:
        condition: service_completed_successfully
    environment:
      AV_URL: http://av:14322
    volumes:
      - connector-state:/state:ro
      - agent-credentials:/credentials:ro
      - ./verify.py:/test/verify.py:ro
    networks: [connectors]

  zap:
    profiles: [security]
    image: ghcr.io/zaproxy/zaproxy:bare@sha256:627781353231d056d5a6305ec1f2092f54735cc654915f533d2e8d5d9d41bcb2
    command:
      - /zap/zap.sh
      - -cmd
      - -autorun
      - /zap/wrk/zap.yaml
    environment:
      ZAP_AUTH_HEADER: Authorization
      ZAP_AUTH_HEADER_SITE: av:14322
      ZAP_AUTH_HEADER_VALUE: Basic b3BlcmF0b3I6cGFzc3dvcmQ= # synthetic integration credential
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1770
      - /home/zap:uid=1000,gid=1000,mode=1770
    volumes:
      - ./zap.yaml:/zap/wrk/zap.yaml:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      av:
        condition: service_started
    networks: [connectors]

networks:
  connectors:
    internal: true

volumes:
  connector-state:
  agent-credentials:
  postgres-data:
  postgres-tls:

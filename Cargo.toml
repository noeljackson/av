[package]
name = "av"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Stateless OIDC-authenticated credential connector and policy proxy"
repository = "https://github.com/noeljackson/av"
rust-version = "1.96"

[dependencies]
anyhow = "=1.0.104"
argon2 = "=0.5.3"
askama = "=0.15.4"
axum = { version = "=0.8.8", features = ["http2", "json", "tokio"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
clap = { version = "=4.6.0", features = ["derive", "env"] }
connectrpc = { version = "=0.8.1", default-features = false, features = ["axum", "gzip", "json", "server", "zstd"] }
buffa = "=0.8.1"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs"] }
http-body-util = "=0.1.4"
hyper = { version = "=1.10.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["http2", "json", "rustls-tls"] }
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "sqlite"] }
time = "=0.3.47"
tempfile = "=3.26.0"
tokio = { version = "=1.50.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "=0.26.4"
tower-http = { version = "=0.6.8", features = ["limit", "request-id", "set-header", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
rustls = "=0.23.42"
url = "=2.5.8"
zeroize = "=1.9.0"

[build-dependencies]
connectrpc-build = "=0.8.0"
protoc-bin-vendored = "=3.2.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[package]
name = "av-credential-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fail-closed credential proxy policy, injection, redaction, and TLS primitives"
repository = "https://github.com/noeljackson/av"
rust-version = "1.91.1"
publish = false

[features]
default = ["certificate-authority"]
certificate-authority = ["dep:rcgen", "dep:rustls", "dep:time"]

[dependencies]
anyhow = "1"
base64 = "0.22"
http = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", optional = true }
url = "2"
zeroize = "1"

[dev-dependencies]
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
tempfile = "=3.26.0"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "rt-multi-thread"] }
tokio-rustls = "=0.26.4"

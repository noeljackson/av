name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Repository and Rust dependency scan
        uses: noeljackson/supplychain@dbf85be2f2efa1b265d96562d7c173b66ea08ec1
        with:
          path: .
          policy: strict
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Helm checks
        run: |
          helm lint chart/av
          helm template av chart/av >/dev/null
          helm lint chart/av -f tests/helm/transparent-values.yaml
          helm template av chart/av -f tests/helm/transparent-values.yaml >/tmp/av-transparent.yaml
          grep --quiet 'kind: CiliumNetworkPolicy' /tmp/av-transparent.yaml
          grep --quiet 'name: av-av-proxy' /tmp/av-transparent.yaml
          if helm template av chart/av --set transparentProxy.enabled=true >/dev/null 2>&1; then
            echo 'transparent proxy rendered without managed session configuration' >&2
            exit 1
          fi
      - name: Docker build
        run: |
          docker build --tag av:test .
          tests/container-smoke.sh av:test
          AV_IMAGE=av:test tests/connector-integration.sh
      - name: Image SBOM and vulnerability policy
        uses: noeljackson/supplychain@dbf85be2f2efa1b265d96562d7c173b66ea08ec1
        with:
          scan-source: "false"
          image: av:test
          fail-on-severity: high

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Repository and Rust dependency scan
        uses: noeljackson/supplychain@5d1a4de3ee932b218e05fc8605b1b8669365603e
        with:
          path: .
          policy: strict
      - name: UI dependency scan and Bun trust baseline
        uses: noeljackson/supplychain@5d1a4de3ee932b218e05fc8605b1b8669365603e
        with:
          path: ui
          policy: strict
          minimum-release-age-days: "30"
          baseline: ../.supplychain/bun-baseline.json
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: UI checks
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
      - name: Helm checks
        run: |
          helm lint chart/av
          helm template av chart/av >/dev/null
      - name: Docker build
        run: docker build --tag av:test .

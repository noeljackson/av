name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-library-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.91.1
          components: clippy
      - name: Shared library MSRV checks
        run: |
          cargo +1.91.1 test --locked -p av-credential-proxy --all-targets
          cargo +1.91.1 clippy --locked -p av-credential-proxy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Repository and Rust dependency scan
        uses: noeljackson/supplychain@dbf85be2f2efa1b265d96562d7c173b66ea08ec1
        with:
          path: .
          policy: strict
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Helm checks
        run: |
          helm lint chart/av
          helm template av chart/av >/dev/null
          label_test_dir="$(mktemp -d)"
          trap 'rm -rf "$label_test_dir"' EXIT
          chart_version=$(awk '$1 == "version:" { print $2; exit }' chart/av/Chart.yaml)
          helm package chart/av --destination "$label_test_dir" --version "${chart_version}+digest"
          helm template av "$label_test_dir/av-${chart_version}+digest.tgz" |
            grep --quiet "helm.sh/chart: \"av-${chart_version}_digest\""
          helm lint chart/av -f tests/helm/transparent-values.yaml
          helm template av chart/av -f tests/helm/transparent-values.yaml >/tmp/av-transparent.yaml
          grep --quiet 'kind: CiliumNetworkPolicy' /tmp/av-transparent.yaml
          grep --quiet 'name: av-av-proxy' /tmp/av-transparent.yaml
          if helm template av chart/av --set transparentProxy.enabled=true >/dev/null 2>&1; then
            echo 'transparent proxy rendered without managed session configuration' >&2
            exit 1
          fi
      - name: Docker build
        run: |
          docker build --tag av:test .
          tests/container-smoke.sh av:test
          tests/transparent-container-smoke.sh av:test
          AV_ENFORCED_CONTAINER_TEST=1 AV_IMAGE=av:test tests/connector-integration.sh
      - name: Image SBOM and vulnerability policy
        uses: noeljackson/supplychain@dbf85be2f2efa1b265d96562d7c173b66ea08ec1
        with:
          scan-source: "false"
          image: av:test
          fail-on-severity: high

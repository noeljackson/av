name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Repository and Rust dependency scan
        uses: noeljackson/supplychain@dbf85be2f2efa1b265d96562d7c173b66ea08ec1
        with:
          path: .
          policy: strict
      - name: UI dependency scan and Bun trust baseline
        uses: noeljackson/supplychain@dbf85be2f2efa1b265d96562d7c173b66ea08ec1
        with:
          path: ui
          policy: strict
          minimum-release-age-days: "30"
          baseline: ../.supplychain/bun-baseline.json
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Build binary and UI
        run: |
          (cd ui && bun install --frozen-lockfile && bun run build)
          cargo build --locked --release
          install -Dm755 target/release/av dist/av
          tar -C dist -czf "dist/av-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" av
          (cd dist && sha256sum "av-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" > "av-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz.sha256")
      - name: Production image auth smoke
        run: |
          docker build --tag av:test .
          tests/container-smoke.sh av:test
          AV_IMAGE=av:test tests/connector-integration.sh
      - name: Image SBOM and vulnerability policy
        uses: noeljackson/supplychain@dbf85be2f2efa1b265d96562d7c173b66ea08ec1
        with:
          scan-source: "false"
          image: av:test
          fail-on-severity: high
      - name: Attest binary
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/av-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
      - uses: docker/login-action@c66a8fcb2472d4283042d726b2a061b43b3f49ab
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc
        id: metadata
        with:
          images: ghcr.io/noeljackson/av
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611
      - name: Build and push image
        id: image
        uses: docker/build-push-action@cb941d0b895b09c17fa011d41c411b33c752cf28
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/noeljackson/av
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package chart/av --destination dist --version "$version" --app-version "$version"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/av-${version}.tgz" oci://ghcr.io/noeljackson/charts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/av-* --generate-notes "${prerelease[@]}"
